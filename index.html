<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basement x Superga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{
  --ink:#0c0c0c; --bg:#ffffff; --grey:#efefef; --line:#d9d9d9; --muted:#8b8b8b;
  --pad:clamp(20px,4.2vw,72px); --accent:#0c0c0c; --edit:#2f6bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (min-width:861px){html{scroll-snap-type:y proximity}}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[data-k]{white-space:pre-line}

/* ---------- top bar / nav ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px var(--pad);pointer-events:none;mix-blend-mode:difference;color:#fff}
.topbar>*{pointer-events:auto}
.tb-brand{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.tb-right{display:flex;align-items:center;gap:18px;font-size:12px;font-weight:500;letter-spacing:.06em}
.tb-count{font-variant-numeric:tabular-nums}
.tb-btn{display:inline-flex;align-items:center;gap:6px;text-transform:uppercase;font-size:12px;letter-spacing:.08em;font-weight:600}
.tb-btn svg{width:16px;height:16px}
.progress{position:fixed;left:0;top:0;height:2px;background:var(--ink);z-index:60;width:0;transition:width .2s}
.dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:45;display:flex;flex-direction:column;gap:10px}
.dot{position:relative;width:10px;height:10px;display:flex;align-items:center;justify-content:center}
.dot i{width:6px;height:6px;border-radius:50%;background:#bbb;transition:all .25s}
.dot.on i{background:var(--ink);transform:scale(1.5)}
.dot span{position:absolute;right:20px;white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 9px;border-radius:3px;opacity:0;transform:translateX(6px);transition:all .2s;pointer-events:none}
.dot:hover span{opacity:1;transform:none}
.index{position:fixed;inset:0;z-index:70;background:var(--ink);color:#fff;padding:90px var(--pad) 40px;display:none;overflow:auto}
.index.open{display:block}
.index ol{list-style:none;max-width:1100px}
.index li a{display:flex;gap:24px;align-items:baseline;padding:14px 0;border-bottom:1px solid #2a2a2a;color:#fff;text-decoration:none;font-size:clamp(22px,3.4vw,46px);font-weight:700;text-transform:uppercase;letter-spacing:-.01em;transition:padding .2s,color .2s}
.index li a:hover{padding-left:12px;color:#bdbdbd}
.index li small{font-size:13px;font-weight:500;color:#777;min-width:32px;font-variant-numeric:tabular-nums}
.index-close{position:absolute;top:16px;right:var(--pad);color:#fff;font-size:12px;letter-spacing:.08em;font-weight:600;text-transform:uppercase}

/* ---------- slides ---------- */
.slide{position:relative;min-height:100vh;min-height:100svh;padding:calc(var(--pad) + 26px) var(--pad) calc(var(--pad) + 46px);display:flex;flex-direction:column;scroll-snap-align:start;overflow:hidden}
.slide.grey{background:var(--grey)}
.slide.dark{background:var(--ink);color:#fff}
.foot{position:absolute;left:var(--pad);right:var(--pad);bottom:22px;display:grid;grid-template-columns:1fr 1fr 1fr;font-size:9px;line-height:1.35;font-weight:600;letter-spacing:.01em;color:inherit;opacity:.9}
.foot .fl{grid-column:2;text-align:center}
.foot .fr{grid-column:3;text-align:right}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.in .rv{opacity:1;transform:none}
.in .rv.d1{transition-delay:.08s}.in .rv.d2{transition-delay:.16s}.in .rv.d3{transition-delay:.24s}.in .rv.d4{transition-delay:.32s}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* section heading (00/ TITLE subtitle) */
.shead{display:flex;flex-direction:column;line-height:.95}
.shead.right{align-items:flex-end;text-align:right}
.shead.left{align-items:flex-start;text-align:left}
.shead.center{align-items:center;text-align:center}
.s-num{font-weight:700;font-size:clamp(40px,6.2vw,96px);letter-spacing:-.02em}
.s-title{font-weight:700;font-size:clamp(34px,5.6vw,88px);letter-spacing:-.02em;text-transform:uppercase}
.s-sub{font-weight:400;font-size:clamp(18px,2.55vw,40px);letter-spacing:.005em;margin-top:.25em;line-height:1.1}
.s-kick{font-weight:700;font-size:clamp(11px,1.1vw,16px);letter-spacing:.01em;text-transform:uppercase;margin-top:clamp(18px,3vw,48px)}
.lead{font-size:clamp(15px,1.25vw,19px);line-height:1.55;max-width:60ch;color:#3a3a3a}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

/* media */
.media{position:relative;overflow:hidden;background:#e4e4e4}
.media>img,.media>video{width:100%;height:100%;object-fit:cover}
.media.contain>img,.media.contain>video{object-fit:contain}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#9a9a9a;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:repeating-linear-gradient(45deg,#e9e9e9 0 12px,#e2e2e2 12px 24px)}
.ph svg{width:28px;height:28px;opacity:.6}
.zoomable{cursor:zoom-in}

/* cover */
.cover{--cw:min(36vw,52vh);position:relative;flex:1;min-height:calc(var(--cw)*1.4)}
.cover-img{width:var(--cw);aspect-ratio:1;filter:grayscale(1)}
.cover-l1,.cover-l2{font-weight:700;font-size:calc(var(--cw)*.235);letter-spacing:-.025em;line-height:.9;text-transform:uppercase;white-space:nowrap}
.cover-l1{position:absolute;left:calc(var(--cw) + var(--cw)*.03);top:calc(var(--cw) - var(--cw)*.205)}
.cover-l2row{position:absolute;left:0;top:calc(var(--cw) + var(--cw)*.0);display:flex;align-items:center;gap:calc(var(--cw)*.045)}
.cover-l2row .rule{display:block;width:calc(var(--cw)*.43);height:max(2px,calc(var(--cw)*.012));background:var(--ink)}
.cover-tag{position:absolute;left:calc(var(--cw)*.475);top:calc(var(--cw)*1.27);font-size:clamp(13px,1.15vw,17px);font-weight:500;letter-spacing:.02em;color:#555;max-width:44ch}
.scroll-hint{position:absolute;right:0;bottom:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.scroll-hint i{display:block;width:1px;height:38px;background:var(--ink);transform-origin:top;animation:hint 1.8s ease-in-out infinite}
@keyframes hint{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}

/* pricing */
.split{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);flex:1}
.split .shead{grid-column:1/-1;grid-row:1}
.price-wrap{grid-column:1/-1;align-self:end;max-width:1040px;width:100%}
.price-list{border-top:2px solid var(--ink);margin-top:28px}
.price-row{position:relative;display:grid;grid-template-columns:1fr auto;gap:24px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline;transition:background .2s,padding .2s}
.price-row:hover{background:var(--grey);padding-left:14px;padding-right:14px}
.pr-name{font-size:clamp(16px,1.45vw,22px);font-weight:700;letter-spacing:-.005em}
.pr-desc{font-size:14px;color:#666;margin-top:6px;line-height:1.45;max-width:62ch}
.pr-price{font-size:clamp(18px,1.6vw,26px);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.pr-unit{font-size:12px;color:#777;text-align:right;margin-top:4px}
.price-total{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 0;font-weight:800;font-size:clamp(18px,1.8vw,28px);text-transform:uppercase;letter-spacing:-.01em}
.note{font-size:12px;color:#777;margin-top:18px;line-height:1.5;max-width:80ch}

/* steps / sequence */
.seq{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));width:min(100%,calc(var(--n,5)*24vh + (var(--n,5) - 1)*18px));gap:clamp(8px,1.2vw,18px);margin-top:clamp(28px,4vw,60px)}
.seq-item{position:relative}
.seq-img{aspect-ratio:1;background:#fff}
.seq-img video{width:100%;height:100%;object-fit:contain;background:#fff}
.vid-ph.sm .pbtn{width:40px;height:40px}.vid-ph.sm .pbtn svg{width:16px;height:16px;margin-left:2px}.vid-ph.sm p{font-size:9px;letter-spacing:.1em}.vid-ph.sm{gap:8px}
.seq-cap{font-size:clamp(10.5px,.85vw,12px);font-weight:600;margin-top:10px;letter-spacing:.01em}
.seq-cap b{font-weight:700;color:var(--muted);margin-right:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:clamp(16px,2vw,32px);margin-top:auto;padding-top:clamp(28px,4vw,56px)}
.step{position:relative;border-top:2px solid var(--ink);padding-top:14px}
.step-n{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.step-t{font-size:clamp(15px,1.3vw,19px);font-weight:700;margin-top:8px}
.step-d{font-size:14px;line-height:1.5;color:#555;margin-top:8px}

/* product (PDP) */
.slide.product{padding-top:calc(var(--pad) + 18px);padding-bottom:var(--pad)}
.pdp-intro{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:18px}
.pdp-intro .s-title{font-size:clamp(28px,3.6vw,56px)}
.pdp-lead{font-size:14px;color:#555;max-width:46ch;text-align:right;line-height:1.5}
.browser{border-radius:12px;background:#fff;box-shadow:0 30px 80px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.06);overflow:hidden;flex:1;display:flex;flex-direction:column}
.bw-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#f4f4f4;border-bottom:1px solid #e6e6e6}
.bw-bar i{width:10px;height:10px;border-radius:50%;background:#d6d6d6}
.bw-url{margin-left:14px;flex:1;max-width:520px;background:#fff;border-radius:6px;padding:5px 12px;font-size:12px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.site-head{display:flex;align-items:center;gap:clamp(16px,3vw,48px);padding:16px clamp(16px,3vw,44px);border-bottom:1px solid #eee}
.site-logo{font-weight:800;font-size:18px;letter-spacing:.02em;color:#0b1b5c;text-transform:uppercase}
.site-menu{white-space:pre;font-size:12px;letter-spacing:.18em;font-weight:500;white-space:nowrap;overflow:hidden;flex:1}
.site-icons{display:flex;gap:16px;margin-left:auto}
.site-icons svg{width:19px;height:19px}
.crumb{font-size:11px;color:#888;padding:12px clamp(16px,3vw,44px) 0}
.pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:clamp(20px,4vw,64px);padding:14px clamp(16px,3vw,44px) 28px;flex:1}
.pdp-gal{display:grid;grid-template-columns:64px 1fr;gap:clamp(12px,2vw,28px);align-items:start}
.pdp-thumbs{display:flex;flex-direction:column;align-items:center;gap:8px;max-height:min(54vh,600px);overflow:auto;scrollbar-width:none}
.thumb{position:relative;width:min(64px,calc((min(54vh,600px) - var(--tn,5)*10px) / var(--tn,5)));aspect-ratio:1;border:1.5px solid transparent;background:#fff;overflow:hidden;flex:none;padding:0}
.thumb.on{border-color:#111}
.thumb img{width:100%;height:100%;object-fit:contain}
.thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18)}
.thumb .play svg{width:22px;height:22px;color:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.thumb .vlabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;letter-spacing:.1em;background:#f1f1f1;color:#888}
.pdp-stage{position:relative;aspect-ratio:1;max-height:min(54vh,600px);background:#fff;overflow:hidden;margin:0 auto;width:100%}
.pdp-stage .media{position:absolute;inset:0;background:#fff}
.pdp-stage .media>img{object-fit:contain;transition:transform .25s ease-out}
.pdp-stage.zooming .media>img{transform:scale(2.1)}
.pdp-stage video{object-fit:contain;background:#fff}
.stage-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:3}
.pdp-stage:hover .stage-nav{opacity:1}
.stage-nav.prev{left:10px}.stage-nav.next{right:10px}
.stage-nav svg{width:16px;height:16px}
.stage-count{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#777;font-variant-numeric:tabular-nums;z-index:3}
.vid-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fafafa}
.vid-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.35}
.vid-ph .pbtn{position:relative;width:74px;height:74px;border-radius:50%;background:#111;color:#fff;display:flex;align-items:center;justify-content:center}
.vid-ph .pbtn svg{width:26px;height:26px;margin-left:4px}
.vid-ph p{position:relative;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#555}
.pdp-info{font-size:14px;color:#111;padding-top:4px}
.pdp-name{font-size:clamp(20px,1.9vw,28px);font-weight:400;letter-spacing:.01em}
.pdp-variant{font-size:15px;font-weight:500;margin-top:2px}
.pdp-desc{color:#555;margin-top:8px;font-size:14px}
.pdp-rating{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:11px;color:#555}
.pdp-rating .stars{color:#0b1b5c;letter-spacing:1px;font-size:12px}
.pdp-price{font-size:clamp(19px,1.7vw,24px);font-weight:700;margin-top:18px}
.pdp-label{font-size:15px;margin-top:20px}
.pdp-row{display:flex;justify-content:space-between;align-items:flex-end}
.guide{display:inline-flex;gap:6px;align-items:center;font-size:12px}
.guide svg{width:14px;height:14px}
.swatches{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:center}
.sw{width:36px;height:36px;border-radius:3px;border:2px solid transparent;box-shadow:inset 0 0 0 3px #fff;outline:1px solid #ddd;transition:transform .15s}
.sw:hover{transform:translateY(-2px)}
.sw.on{border-color:#111;outline-color:#111}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px;margin-top:10px;max-width:520px}
.size{height:38px;border:1px solid #d5d5d5;font-size:13px;transition:all .15s;background:#fff}
.size:hover:not(.out){border-color:#111}
.size.on{background:#111;color:#fff;border-color:#111}
.size.out{border-style:dashed;color:#c4c4c4;cursor:not-allowed}
.cta-row{display:flex;gap:16px;align-items:center;margin-top:18px}
.cta{flex:1;height:46px;border-radius:30px;background:#f2f2f2;color:#bdbdbd;font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;transition:all .25s}
.cta.ready{background:#111;color:#fff}
.cta.ready:hover{background:#333}
.wish svg{width:26px;height:26px;transition:transform .2s}
.wish.on svg{fill:#111;transform:scale(1.1)}
.ship{font-size:13px;font-weight:700;text-align:center;margin-top:22px;text-transform:uppercase}
.ship-bar{height:5px;background:#cfcfcf;border-radius:3px;margin:10px 14px 0;overflow:hidden}
.ship-bar span{display:block;height:100%;width:3%;background:#111;border-radius:3px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.pdp-infos{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
.pdp-infos li{position:relative;display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.pdp-infos svg{width:20px;height:20px;flex:none}

/* offer (proposta economica) */
.offer-grid{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:clamp(20px,3.4vw,56px);margin-top:clamp(28px,4vw,56px)}
.offer-col{position:relative;border-top:2px solid var(--ink);padding-top:18px}
.oc-tag{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.oc-name{font-size:clamp(20px,2vw,30px);font-weight:700;letter-spacing:-.01em;margin-top:6px}
.oc-desc{font-size:clamp(14px,1.1vw,16px);color:#444;margin-top:4px}
.oc-blocks{margin-top:18px}
.ob{position:relative;display:grid;grid-template-columns:1fr auto;gap:8px 24px;padding:14px 0;border-bottom:1px solid var(--line);transition:background .2s,padding .2s}
.ob:hover{background:var(--grey);padding-left:12px;padding-right:12px}
.ob-t{font-size:clamp(14px,1.15vw,17px);font-weight:700}
.ob-inc{font-size:12.5px;color:#666;margin-top:3px}
.ob-det{font-size:12.5px;color:#888;margin-top:6px;line-height:1.5}
.ob-p{text-align:right}
.ob-price{font-size:clamp(18px,1.7vw,26px);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ob-unit{font-size:11.5px;color:#777;margin-top:3px}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:clamp(16px,2vw,32px);margin-top:clamp(32px,4vw,60px)}
.term{position:relative;background:var(--grey);padding:18px 18px 20px;border-radius:2px}
.term-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.term-d{font-size:13.5px;line-height:1.55;color:#444;margin-top:10px}
.ob-total{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin-top:10px;padding:18px 0}
.ob-total:hover{background:transparent;padding-left:0;padding-right:0}
.ob-total .ob-t{font-size:clamp(16px,1.4vw,21px);text-transform:uppercase;letter-spacing:.01em}
.ob-total .ob-inc{font-size:13px;color:#333;font-weight:500}
.ob-total .ob-price{font-size:clamp(26px,2.6vw,40px);letter-spacing:-.01em}
.ob-old{display:block;font-size:15px;font-weight:500;color:#9a9a9a;text-decoration:line-through}
.oc-xt{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-top:26px}
.oc-x{font-size:13px;color:#555;line-height:1.65;margin-top:8px}
.offer-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:clamp(20px,3.4vw,56px);margin-top:clamp(28px,3.4vw,48px)}
.onote{position:relative;border-left:3px solid var(--ink);padding:4px 0 4px 18px}
.onote.out{border-left-color:#b8b8b8}
.onote-t{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.onote-d{font-size:14px;line-height:1.65;color:#333;margin-top:10px}
.offer-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:auto;padding-top:clamp(24px,3vw,44px);font-size:13px}
.offer-foot .of-note{color:#777;max-width:70ch;line-height:1.5}
.offer-foot .of-sign{text-align:right;line-height:1.5;margin-left:auto}
.offer-foot .of-sign b{font-weight:700}
/* product: mobile carousel (hidden on desktop) */
.pdp-track,.pt-dots,.bw-dom,.site-icons .mob-only{display:none}
.site-icons span{display:block}
.pdp-track{overflow-x:auto;scroll-snap-type:x mandatory;padding:0 7%;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pdp-track::-webkit-scrollbar{display:none}
.pt-item{flex:0 0 86%;scroll-snap-align:center;position:relative;aspect-ratio:1}
.pt-item .media{position:absolute;inset:0;background:#fff}
.pt-item .media>img,.pt-item video{object-fit:contain;background:#fff}
.pt-zoom{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid #e3e3e3;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pt-zoom svg{width:19px;height:19px}
.pt-dots{justify-content:center;gap:12px;margin-top:14px}
.pt-dot{width:8px;height:8px;border-radius:50%;background:#c4c4c4;padding:0;transition:all .2s}

function slideHTML(s,i){
  var p='slides.'+i, fn=R[s.type]||R.text;
  var cls='slide '+(s.type==='cover'?'cover-slide ':'')+(s.type==='product'?'product ':'')+(s.bg==='grey'?'grey ':'')+(s.bg==='dark'?'dark ':'')+(s.hidden?'is-hidden ':'')+(revealed[s.id]||editing?'in':'');
  var ctrl=editing?'<div class="s-ctrl"><span>'+pad2(i+1)+' · '+esc(typeName(s.type))+'</span><button data-sact="up" data-i="'+i+'" title="Sposta su">↑</button><button data-sact="down" data-i="'+i+'" title="Sposta giù">↓</button><button data-sact="bg" data-i="'+i+'" title="Sfondo">◐</button><button data-sact="dup" data-i="'+i+'" title="Duplica">Duplica</button><button data-sact="hide" data-i="'+i+'">'+(s.hidden?'Mostra':'Nascondi')+'</button><button data-sact="del" data-i="'+i+'" title="Elimina">✕</button></div>':'';
  return '<section class="'+cls+'" id="'+esc(s.id)+'" data-si="'+i+'">'+ctrl+fn(s,p,i)+foot(s)+'</section>';
}
function typeName(t){return {cover:'Cover',pricing:'Proposta',offer:'Proposta economica',steps:'Sequenza',product:'Prodotto',gallery:'Galleria',social:'Social',studio:'Studio',thanks:'Chiusura',text:'Testo',section:'Titolo'}[t]||t;}
function visible(){return S.slides.map(function(s,i){return {s:s,i:i};}).filter(function(x){return editing||!x.s.hidden;});}
function render(keep){
  var y=window.scrollY;
  document.body.classList.toggle('editing',editing);
  document.title=S.meta.title||'Presentazione';
  app.innerHTML=S.slides.map(slideHTML).join('');
  renderUI();
  bindEditable();

  syncTracks(app);
  if(keep){try{window.scrollTo({top:y,behavior:'instant'});}catch(e){window.scrollTo(0,y);}}
  onScroll();
}
function rerenderSlide(i){

  var tmp=document.createElement('div'); tmp.innerHTML=slideHTML(S.slides[i],i);

/* ---------- mobile product carousel ---------- */
function trackItemLeft(t,k){var it=t.children[k];return it?it.offsetLeft-(t.clientWidth-it.clientWidth)/2:0;}
function syncTracks(root){(root||app).querySelectorAll('.pdp-track').forEach(function(t){var k=pdpGet(+t.dataset.track).m;if(k>0)t.scrollLeft=trackItemLeft(t,k);});}
document.addEventListener('scroll',function(e){
  var t=e.target; if(!t.classList||!t.classList.contains('pdp-track')) return;
  var i=+t.dataset.track, w=t.children[0]?t.children[0].clientWidth:1, k=Math.max(0,Math.min(t.children.length-1,Math.round(t.scrollLeft/w)));
  if(pdpGet(i).m===k) return; pdpGet(i).m=k;
  var sl=t.closest('.slide'); if(!sl) return;
  sl.querySelectorAll('.pt-dot').forEach(function(d,j){d.classList.toggle('on',j===k);});
},true);

/* ---------- reveal + scroll tracking ---------- */
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');revealed[e.target.id]=1;}});},{threshold:.18}):null;
function observe(){app.querySelectorAll('.slide').forEach(function(s){if(io)io.observe(s);else s.classList.add('in');});}
function slidesEls(){return Array.prototype.filter.call(app.querySelectorAll('.slide'),function(e){return e.offsetParent!==null;});}
var ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var els=slidesEls(), mid=window.innerHeight*.45, k=0;
    els.forEach(function(e,j){if(e.getBoundingClientRect().top<=mid)k=j;});
    current=k;
    var h=document.documentElement.scrollHeight-window.innerHeight;
    var pr=document.getElementById('prog'); if(pr) pr.style.width=(h>0?window.scrollY/h*100:0)+'%';
    var c=document.getElementById('count'); if(c) c.textContent=pad2(k+1)+' / '+pad2(els.length);
    var cur=els[k];
    document.querySelectorAll('.dot').forEach(function(d){d.classList.toggle('on',cur&&d.getAttribute('href')==='#'+cur.id);});
    if(cur&&location.hash!=='#'+cur.id){try{history.replaceState(null,'','#'+cur.id);}catch(e){}}
  });
}
window.addEventListener('scroll',onScroll,{passive:true});
window.addEventListener('resize',onScroll);
function goTo(k){var els=slidesEls();k=Math.max(0,Math.min(els.length-1,k));if(els[k])els[k].scrollIntoView({behavior:'smooth',block:'start'});}

/* ---------- interactions (view) ---------- */
function toast(m){var t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},2600);}
function lbItemOf(f){
  var v=f.querySelector('video'); if(v&&v.getAttribute('src')) return {type:'video',src:v.getAttribute('src'),poster:v.getAttribute('poster')||''};
  var im=f.querySelector(':scope > img'); if(im&&im.getAttribute('src')) return {type:'img',src:im.getAttribute('src')};
  return null;
}
function openLB(fig){
  var slide=fig.closest('.slide'); if(!slide) return;
  var sel=fig.closest('.pdp-track')?'.pdp-track .pdp-img':'.zoomable, .pdp-stage .pdp-img';
  var figs=Array.prototype.slice.call(slide.querySelectorAll(sel)), items=[], idx=0;
  figs.forEach(function(f){var it=lbItemOf(f); if(!it) return; if(f===fig) idx=items.length; items.push(it);});
  lbItems=items; lbIdx=idx;
  if(!lbItems.length) return; showLB(); document.getElementById('lb').classList.add('open');
}
function showLB(){
  var lb=document.getElementById('lb'), it=lbItems[lbIdx], box=lb.querySelector('.lb-media');
  box.innerHTML=it.type==='video'?'<video src="'+esc(it.src)+'"'+(it.poster?' poster="'+esc(it.poster)+'"':'')+' autoplay muted loop playsinline controls></video>':'<img alt="" src="'+esc(it.src)+'">';
  lb.querySelector('.lb-c').textContent=lbItems.length>1?(lbIdx+1)+' / '+lbItems.length:'';
  lb.querySelector('.lb-p').style.display=lb.querySelector('.lb-n').style.display=lbItems.length>1?'':'none';
}
function closeLB(){var lb=document.getElementById('lb');if(lb){lb.classList.remove('open');var b=lb.querySelector('.lb-media');if(b)b.innerHTML='';}}

document.addEventListener('click',function(e){
  var t=e.target, b;
  if((b=t.closest('[data-go]'))){e.preventDefault();var el=document.getElementById(S.slides[+b.dataset.go].id);document.getElementById('index').classList.remove('open');if(el)el.scrollIntoView({behavior:'smooth'});return;}
  if((b=t.closest('[data-ui]'))){
    var a=b.dataset.ui;
    if(a==='index')document.getElementById('index').classList.add('open');
    if(a==='close')document.getElementById('index').classList.remove('open');
    if(a==='full'){try{if(document.fullscreenElement)document.exitFullscreen();else{var pr=document.documentElement.requestFullscreen();if(pr&&pr.catch)pr.catch(function(){toast('Schermo intero non disponibile qui');});}}catch(err){toast('Schermo intero non disponibile qui');}}
    return;
  }
  if((b=t.closest('[data-lb]'))){var a2=b.dataset.lb;if(a2==='x')closeLB();if(a2==='p'){lbIdx=(lbIdx-1+lbItems.length)%lbItems.length;showLB();}if(a2==='n'){lbIdx=(lbIdx+1)%lbItems.length;showLB();}return;}
  if(t.id==='lb'||t.classList.contains('lb-media')){closeLB();return;}
  if((b=t.closest('[data-ptdot]'))){var tr=b.closest('.slide').querySelector('.pdp-track');if(tr)tr.scrollTo({left:trackItemLeft(tr,+b.dataset.j),behavior:'smooth'});return;}
  if((b=t.closest('[data-thumb]'))){var i=+b.dataset.thumb;pdpGet(i).m=+b.dataset.j;rerenderSlide(i);return;}
  if((b=t.closest('[data-step]'))){var i2=+b.dataset.step,st=pdpGet(i2),n=S.slides[i2].variants[st.v].media.length;st.m=(st.m+ +b.dataset.d+n)%n;rerenderSlide(i2);return;}
  if((b=t.closest('[data-sw]'))&&!t.closest('.li-ctrl')){var i3=+b.dataset.sw,st3=pdpGet(i3);st3.v=+b.dataset.j;st3.m=Math.min(st3.m,S.slides[i3].variants[st3.v].media.length-1);rerenderSlide(i3);return;}
  if((b=t.closest('[data-size]'))){var i4=+b.dataset.size,st4=pdpGet(i4);st4.size=st4.size===b.dataset.z?null:b.dataset.z;st4.added=false;rerenderSlide(i4);return;}
  if((b=t.closest('[data-cta]'))){var i5=+b.dataset.cta,st5=pdpGet(i5);if(!st5.size){toast('Seleziona una taglia');return;}st5.added=true;rerenderSlide(i5);toast(S.slides[i5].name+' · taglia '+st5.size+' aggiunto (demo)');return;}
  if((b=t.closest('[data-wish]'))){var i6=+b.dataset.wish,st6=pdpGet(i6);st6.wish=!st6.wish;rerenderSlide(i6);return;}
  if(editing){editClick(e);return;}
  if((b=t.closest('.zoomable'))&&lbItemOf(b)){openLB(b);return;}
  if((b=t.closest('.pdp-track .pdp-img'))&&b.querySelector('img')){openLB(b);return;}
  if((b=t.closest('.pdp-stage'))&&b.querySelector('.pdp-img img')&&window.innerWidth<861){openLB(b);return;}
});
document.addEventListener('mousemove',function(e){
  if(editing) return;
  var st=e.target.closest&&e.target.closest('.pdp-stage'); if(!st) return;
  var img=st.querySelector('.pdp-img img'); if(!img) return;
  var r=st.getBoundingClientRect(); img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+'% '+((e.clientY-r.top)/r.height*100)+'%';

function listAct(list,i,act){
  var arr=get(list); if(!arr) return; snapshot();
  if(act==='up'&&i>0){var x=arr.splice(i,1)[0];arr.splice(i-1,0,x);}
  else if(act==='down'&&i<arr.length-1){var y=arr.splice(i,1)[0];arr.splice(i+1,0,y);}
  else if(act==='dup'){arr.splice(i+1,0,clone(arr[i]));}
  else if(act==='del'){arr.splice(i,1);}
  else if(act==='add'){var key=list.split('.').pop();arr.push(arr.length?clone(arr[arr.length-1]):clone(TPL[key]||{}));}
  markDirty();
  var si=+list.split('.')[1]; rerenderSlide(si); renderUIKeep();
}
function slideAct(i,act){
  snapshot(); var arr=S.slides, s=arr[i];
  if(act==='up'&&i>0){arr.splice(i,1);arr.splice(i-1,0,s);}
  else if(act==='down'&&i<arr.length-1){arr.splice(i,1);arr.splice(i+1,0,s);}
  else if(act==='dup'){var c=clone(s);c.id=uid();arr.splice(i+1,0,c);}
  else if(act==='hide'){s.hidden=!s.hidden;}
  else if(act==='bg'){s.bg=s.bg==='grey'?'dark':(s.bg==='dark'?'':'grey');}
  else if(act==='del'){
    undoStack.pop();
    return ask('Eliminare questa slide?','Puoi recuperarla con “Annulla” finché non pubblichi.',[{t:'Annulla'},{t:'Elimina',cls:'danger',fn:function(){snapshot();arr.splice(i,1);pdpState={};markDirty();render(true);}}]);
  }
  pdpState={}; markDirty(); render(true);
  if(act==='up'||act==='down'||act==='dup'){var el=document.getElementById((act==='dup'?arr[i+1]:s).id);if(el)el.scrollIntoView({block:'start'});}
}

function edAct(a){
  if(a==='enter'){
    editing=true; var d=loadDraft(), base=PUBLISHED.length+':'+hash(PUBLISHED);
    var stale=false; if(d&&d.base!==base){clearDraft();d=null;stale=true;}
    if(d&&JSON.stringify(d.data)!==JSON.stringify(S)){S=d.data;dirty=true;render(true);toast('Bozza non pubblicata ripristinata');}

  }
  else if(a==='exit'){editing=false;render(true);if(dirty)toast('Modifiche salvate come bozza in questo browser. Pubblica per renderle visibili.');}

function buildHTML(){

    '<script id="content" type="application/json">\n'+data+'\n<\/script>\n<script id="main">'+js+'<\/script>\n</body>\n</html>\n';

function publish(){

/* uploads */
function pickFile(accept){return new Promise(function(res){var inp=document.createElement('input');inp.type='file';inp.accept=accept;inp.style.display='none';document.body.appendChild(inp);inp.onchange=function(){res(inp.files[0]||null);inp.remove();};inp.click();});}
function downscale(file,max){
  max=max||2400;
  return new Promise(function(res){
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return res(file);
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h));
      if(k===1&&file.size<1.5e6){URL.revokeObjectURL(url);return res(file);}
      var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      var ctx=c.getContext('2d');var png=file.type==='image/png';
      if(!png){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);}
      ctx.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(function(b){res(b||file);},png?'image/png':'image/jpeg',.88);
    };
    img.onerror=function(){URL.revokeObjectURL(url);res(file);};
    img.src=url;
  });
}
function toDataURL(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(blob);});}
function storeFile(file){
  var isVid=/^video\//.test(file.type);
  if(isVid&&file.size>20*1024*1024) return Promise.reject(new Error('Il video supera 20 MB: esportalo più leggero (H.264, 1080p, pochi secondi).'));
  return (isVid?Promise.resolve(file):downscale(file)).then(function(blob){
    if(assetsApi) return assetsApi.upload(blob).then(function(r){return r.url||('/_blob/'+r.id);});
    if(hasClaude) throw new Error('Caricamento file non disponibile per questo utente.');
    return toDataURL(blob);
  });
}
function pickAndStore(p,accept,fig){
  pickFile(accept).then(function(f){if(f)putFile(p,f,fig);});
}
function putFile(p,f,fig){
  if(fig)fig.classList.add('busy');
  storeFile(f).then(function(url){snapshot();set(p,url);markDirty();var si=+p.split('.')[1];rerenderSlide(si);toast('Caricato');})
  .catch(function(err){if(fig)fig.classList.remove('busy');toast(err&&err.message?err.message:'Caricamento non riuscito');});
}

  if(itm&&itm.type){var it=get(p.replace(/\.src$/,''));if(it&&/^video\//.test(file.type))it.type='video';else if(it&&/^image\//.test(file.type)&&it.type==='video'){p=p.replace(/\.src$/,'.poster');}}
  putFile(p,file,f);
});
